<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phase 5 Dashboard Test</title>
  <style>
    body { margin:0; padding:16px; font-family:Arial, sans-serif; background:#111; color:white; }
    .app { max-width:760px; margin:0 auto; }
    input, button { width:100%; padding:14px; margin:8px 0; border-radius:10px; border:1px solid #444; font-size:16px; }
    input { background:#1b1b1b; color:white; }
    button { background:#2f80ed; color:white; border:0; font-weight:bold; }
    .cards { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
    .card { background:#1b1b1b; border:1px solid #333; border-radius:14px; padding:14px; }
    .big { font-size:22px; font-weight:bold; }
    table { width:100%; border-collapse:collapse; margin-top:12px; background:#1b1b1b; border-radius:12px; overflow:hidden; }
    th,td { padding:10px; border-bottom:1px solid #333; text-align:left; font-size:14px; }
    th { color:#aaa; }
    .error { background:#4a1717; padding:12px; border-radius:10px; }
  </style>
</head>
<body>
<div class="app">
  <h1>Dashboard test</h1>

  <input id="gasUrl" placeholder="GAS /exec URL">
  <input id="year" type="number" placeholder="Godina">
  <input id="month" type="number" placeholder="Mesec">
  <button onclick="loadDashboard()">Učitaj dashboard</button>

  <div id="out"></div>
</div>

<script>
const out = document.getElementById("out");
document.getElementById("gasUrl").value = localStorage.getItem("gasUrl") || "";
document.getElementById("year").value = new Date().getFullYear();
document.getElementById("month").value = new Date().getMonth() + 1;

function money(n) {
  return new Intl.NumberFormat("sr-RS", { maximumFractionDigits: 2 }).format(Number(n || 0)) + " RSD";
}

function jsonp(url) {
  return new Promise((resolve, reject) => {
    const cb = "cb_" + Date.now() + "_" + Math.floor(Math.random() * 10000);
    window[cb] = data => {
      resolve(data);
      delete window[cb];
      script.remove();
    };
    const script = document.createElement("script");
    script.onerror = () => {
      delete window[cb];
      reject(new Error("JSONP error"));
    };
    script.src = url + (url.includes("?") ? "&" : "?") + "callback=" + encodeURIComponent(cb);
    document.body.appendChild(script);
  });
}

async function loadDashboard() {
  const gasUrl = document.getElementById("gasUrl").value.trim();
  const year = document.getElementById("year").value;
  const month = document.getElementById("month").value;
  localStorage.setItem("gasUrl", gasUrl);

  out.innerHTML = "Učitavam...";

  try {
    const url = gasUrl + "?action=dashboard&year=" + encodeURIComponent(year) + "&month=" + encodeURIComponent(month);
    const payload = await jsonp(url);
    render(payload.dashboard);
  } catch (e) {
    out.innerHTML = '<div class="error">' + e.message + '</div>';
  }
}

function render(d) {
  const s = d.summary;
  out.innerHTML = `
    <div class="cards">
      <div class="card"><div>Ukupno</div><div class="big">${money(s.totalAmount)}</div></div>
      <div class="card"><div>Računa</div><div class="big">${s.receiptCount}</div></div>
      <div class="card"><div>Stavki</div><div class="big">${s.itemCount}</div></div>
      <div class="card"><div>Nerazvrstano</div><div class="big">${s.uncategorizedCount}</div></div>
    </div>

    <h2>Kategorije</h2>
    ${table(["Kategorija","Iznos","Broj"], d.categoryTotals.slice(0, 10).map(r => [
      r.category + " / " + r.subcategory, money(r.amount), r.count
    ]))}

    <h2>Prodavci</h2>
    ${table(["Prodavac","Iznos","Broj"], d.vendorTotals.slice(0, 10).map(r => [
      r.vendor, money(r.amount), r.count
    ]))}

    <h2>Po danima</h2>
    ${table(["Dan","Iznos","Broj"], d.dailyTotals.map(r => [
      r.day, money(r.amount), r.count
    ]))}
  `;
}

function table(headers, rows) {
  return `<table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>
    ${rows.map(row => `<tr>${row.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}
  </tbody></table>`;
}
</script>
</body>
</html>
